<!DOCTYPE html>
<html>
<head>
    <title>{{ pet.name }}</title>
</head>
<body>
    <h1>🌟{{ pet.name }}🌟</h1>
    <p><b>Turi:</b> {{ pet.species }}</p>
    <p><b>Yoshi:</b> {{ pet.age }}</p>
    {% if pet.image %}
        <img src="{{ pet.image.url }}" alt="{{ pet.name }}" width="300">
    {% else %}
        <p>Rasm yo'q</p>
    {% endif %}
    
    <form action="{% url 'pet_list' %}", method="get">
        <button type="submit">Orqaga</button>
    </form></body>
</html>
